<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction App</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <div class="container">
        <h1>2025 March Madness Match-ups</h1>
        <select id="team1">
            <!-- Options will be populated by JavaScript -->
        </select>
        <select id="team2">
            <!-- Options will be populated by JavaScript -->
        </select>
        <button id="predictButton">Predict Winner</button>
        <div class="result" id="result"></div>
        <div class="error" id="error"></div>
        
        <!-- New Section for Model Information -->
        <div class="model-info">
            <h2>Madness Model 3.0</h2>
            <p>Trained on 2010-2023 data, validated on 2024 stats, and includes partial 2025 season data.</p>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="scripts/app.js"></script>
    <script>
        // Theme toggle functionality
        const currentTheme = localStorage.getItem('theme') || 'light';

        if (currentTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }

        // Listen for changes in the main site's theme
        window.addEventListener('storage', (event) => {
            if (event.key === 'theme') {
                const newTheme = event.newValue;
                document.documentElement.setAttribute('data-theme', newTheme);
            }
        });
    </script>
</body>
</html>
